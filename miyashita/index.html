<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宮下パークFPS｜PLATEAUで渋谷・宮下パークの屋上を再現</title>
<meta name="description" content="国の3D都市モデル（PLATEAU）で、渋谷・宮下パークの屋上を再現。PC向け。">
<meta name="theme-color" content="#fbf8f3">
<link rel="icon" href="../assets/dpg_icon.png">
<link rel="apple-touch-icon" href="../assets/dpg_icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ドパガキ問題集">
<meta property="og:title" content="宮下パークFPS｜PLATEAUで渋谷・宮下パークの屋上を再現">
<meta property="og:description" content="国の3D都市モデル（PLATEAU）で、渋谷・宮下パークの屋上を再現。PC向け。">
<meta property="og:image" content="https://dopagaki-quiz.github.io/og/miyashita.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://dopagaki-quiz.github.io/miyashita/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="宮下パークFPS｜PLATEAUで渋谷・宮下パークの屋上を再現">
<meta name="twitter:description" content="国の3D都市モデル（PLATEAU）で、渋谷・宮下パークの屋上を再現。PC向け。">
<meta name="twitter:image" content="https://dopagaki-quiz.github.io/og/miyashita.png">
<style>:root{--bg:#fbf8f3;--tx:#221f1c;--sub:#6f6860;--pu:#6d3fe0;--pl:#efe8fd;--ln:#e6dfd3;--card:#fff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:#f1ece3;color:var(--tx);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic",Meiryo,sans-serif;font-feature-settings:"palt";line-height:1.7;font-size:16px;overflow-wrap:anywhere}
img,video{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
.col{max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative}
@media(min-width:520px){.col{box-shadow:0 0 0 1px var(--ln),0 12px 40px rgba(60,40,20,.08)}}
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;padding:12px 20px;border-radius:16px;background:var(--pu);color:#fff;font-weight:800;font-size:18px;text-decoration:none;text-align:center;border:0;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--pl);color:var(--pu)}
.btn.sm{min-height:48px;font-size:15px;border-radius:12px;padding:8px 16px}
.btn.line{background:#fff;color:var(--tx);border:1px solid var(--ln);font-weight:700}
/* hero */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;padding:22px 20px calc(22px + env(safe-area-inset-bottom));overflow:hidden;isolation:isolate}
.hero-bg,.hero-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3}
.leaf{position:absolute;z-index:-2;pointer-events:none;will-change:transform}
.leaf.l1{width:130%;height:38%;left:-15%;top:6%;background:radial-gradient(ellipse at 40% 50%,rgba(255,255,255,.7),rgba(255,255,255,0) 68%);transform:rotate(-14deg);animation:sway1 10s ease-in-out infinite alternate}
.leaf.l2{width:120%;height:34%;left:-10%;top:52%;background:radial-gradient(ellipse at 55% 50%,rgba(109,63,224,.10),rgba(109,63,224,0) 66%);transform:rotate(12deg);animation:sway2 12s ease-in-out infinite alternate}
.leaf.l3{width:90%;height:26%;left:20%;top:30%;background:radial-gradient(ellipse at 50% 50%,rgba(255,236,190,.55),rgba(255,236,190,0) 66%);transform:rotate(-6deg);animation:sway3 9s ease-in-out infinite alternate}
@keyframes sway1{from{transform:translate3d(-6%,0,0) rotate(-14deg)}to{transform:translate3d(8%,4%,0) rotate(-9deg)}}
@keyframes sway2{from{transform:translate3d(7%,0,0) rotate(12deg)}to{transform:translate3d(-8%,-4%,0) rotate(7deg)}}
@keyframes sway3{from{transform:translate3d(-5%,3%,0) rotate(-6deg)}to{transform:translate3d(6%,-3%,0) rotate(-1deg)}}
.hero-top{display:block}
.handle{display:inline-block;font-size:13px;color:#4a443d;font-weight:800;letter-spacing:.02em;background:rgba(251,248,243,.75);border-radius:999px;padding:1px 10px}
.brand{display:flex;align-items:center;gap:10px;margin-top:8px}
.brand img{width:44px;height:44px;border-radius:11px}
.brand span{font-weight:800;font-size:18px}
.hero-mid{margin-top:auto;margin-bottom:auto;padding:22px 0}
.hero h1{font-size:40px;line-height:1.28;font-weight:900;letter-spacing:-.01em}
.hero h1 .w{display:inline-block}
.hero h1 em{font-style:normal;color:var(--pu)}
.lead{margin-top:16px;font-size:15px;line-height:1.75;color:#3a352f}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.stat{background:rgba(255,255,255,.78);border:1px solid rgba(230,223,211,.9);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:22px;line-height:1.2;font-weight:900;color:var(--pu);white-space:nowrap;letter-spacing:-.02em}
.stat b small{font-size:12px;font-weight:800;margin-left:1px}
.stat span{display:block;font-size:11.5px;color:var(--sub);margin-top:2px;line-height:1.35}
.hero-bottom .btn{width:100%}
.hint{text-align:center;margin-top:12px;font-size:13px;color:var(--sub);font-weight:700}
/* sections */
.sec{padding:44px 20px}
.sec h2{font-size:26px;line-height:1.35;font-weight:900}
.sec .kicker{font-size:12px;font-weight:800;color:var(--pu);letter-spacing:.06em;margin-bottom:6px}
.sec .sub{margin-top:8px;color:var(--sub);font-size:14px}
/* quiz */
.quiz-card{margin-top:18px;background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:18px 16px;box-shadow:0 6px 20px rgba(60,40,20,.05)}
.q-text{font-weight:800;font-size:16.5px;line-height:1.7}
.stmts{margin-top:12px;display:grid;gap:8px}
.stmts li{display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:14px;line-height:1.7;background:var(--bg);border-radius:12px;padding:10px 12px}
.stmts li b{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--pl);color:var(--pu);font-size:13px;font-weight:800;margin-top:2px}
.opts{margin-top:14px;display:grid;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:10px;width:100%;min-height:56px;padding:10px 14px;border-radius:14px;border:2px solid var(--ln);background:#fff;font:inherit;font-size:17px;font-weight:700;color:var(--tx);text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt .m{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--pl);color:var(--pu);font-weight:800}
.opt[aria-disabled=true]{cursor:default}
.opt.is-correct{border-color:#1f8a4c;background:#e9f7ee}
.opt.is-correct .m{background:#1f8a4c;color:#fff}
.opt.is-wrong{border-color:#c2410c;background:#fdeee6}
.opt.is-wrong .m{background:#c2410c;color:#fff}
.src{margin-top:12px;font-size:12px;color:var(--sub)}
.result{margin-top:14px;padding:14px;border-radius:14px;background:var(--pl)}
.result[hidden]{display:none}
.result .verdict{font-weight:900;font-size:18px}
.result.ok .verdict{color:#1f8a4c}
.result.ng .verdict{color:#c2410c}
.result .exp{margin-top:6px;font-size:14px;line-height:1.8}
.result .retry{margin-top:10px;min-height:44px;padding:8px 14px;border:1px solid var(--ln);background:#fff;border-radius:12px;font:inherit;font-size:14px;font-weight:700;color:var(--pu);cursor:pointer}
.more{margin-top:14px}
.more .btn{width:100%}
/* steps */
.step{margin-top:32px;text-align:center}
.step .no{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--pu);color:#fff;font-weight:900}
.step h3{margin-top:8px;font-size:21px;line-height:1.4;font-weight:900}
.step p{margin:6px auto 0;font-size:14.5px;color:#3a352f;max-width:320px;text-align:left}
.phone{margin:16px auto 0;width:210px;border-radius:30px;padding:7px;background:#e7e0f7;border:1px solid #d4c8f2;box-shadow:0 10px 28px rgba(109,63,224,.16)}
.phone img{border-radius:24px;width:100%;height:auto}
/* shelf */
.shelf{margin-top:18px;display:grid;gap:12px}
.shelf li{display:block}
.shelf .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;font-weight:700}
.shelf .row b{font-size:15px;color:var(--pu);white-space:nowrap;font-weight:900}
.bar{margin-top:5px;height:14px;border-radius:7px;background:var(--pl);overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#8d6af0,var(--pu))}
.bar.en i{background:linear-gradient(90deg,#e0a04a,#c9822a)}
.shelf .en-row b{color:#a86a1a}
.note{margin-top:14px;font-size:12px;color:var(--sub)}
/* fixed cta */
.fcta{position:fixed;left:50%;bottom:0;width:min(100%,480px);transform:translate(-50%,110%);padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(251,248,243,.98) 70%,rgba(251,248,243,0));opacity:0;visibility:hidden;transition:transform .25s ease,opacity .25s ease,visibility 0s .25s;z-index:20}
.fcta.on{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .25s ease,opacity .25s ease}
.fcta .btn{width:100%;min-height:52px;font-size:17px;box-shadow:0 8px 20px rgba(109,63,224,.28)}
.zone-end{height:76px}
/* works */
.works{background:#f5f0e7;padding:44px 0 36px}
.works .head{padding:0 20px}
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px 20px 8px;scroll-padding:0 20px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.card{flex:0 0 calc(min(100vw,480px)*.82);scroll-snap-align:start;background:var(--card);border:1px solid var(--ln);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 20px rgba(60,40,20,.06)}
.media{position:relative;aspect-ratio:16/9;background:#eae4f7;overflow:hidden}
.media img,.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media.pan img{width:130%;max-width:none;animation:pan 16s ease-in-out infinite alternate}
@keyframes pan{from{transform:translateX(0)}to{transform:translateX(-23%)}}
.cbody{padding:14px 14px 16px;display:flex;flex-direction:column;flex:1}
.badge{align-self:flex-start;font-size:11.5px;font-weight:800;color:var(--pu);background:var(--pl);border-radius:999px;padding:2px 10px}
.card h3{margin-top:8px;font-size:19px;line-height:1.4;font-weight:900}
.card .c{margin-top:4px;font-size:14px;color:#3a352f;line-height:1.65}
.credit{margin-top:8px;font-size:11.5px;color:var(--sub);line-height:1.6}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.modes a{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;background:var(--pl);color:var(--pu);font-weight:800;font-size:14px;text-decoration:none}
.acts{margin-top:auto;padding-top:14px;display:grid;gap:8px}
.share-msg{min-height:0;font-size:12.5px;color:var(--sub);word-break:break-all;user-select:all;-webkit-user-select:all}
.share-msg:empty{display:none}
.share-msg.ok{color:#1f8a4c;font-weight:800;user-select:auto}
/* footer */
.foot{padding:36px 20px calc(40px + env(safe-area-inset-bottom));text-align:center}
.foot .mw{font-weight:800;font-size:15px}
.socials{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.socials a{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;background:#fff;border:1px solid var(--ln);text-decoration:none;font-weight:800;font-size:15px}
.foot .h{margin-top:14px;font-size:13px;color:var(--sub)}
/* sub pages */
.sub-page{padding:8px 20px calc(36px + env(safe-area-inset-bottom))}
.back{display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:800;color:var(--pu);text-decoration:none}
.sub-media{margin-top:6px;border-radius:20px;overflow:hidden}
.sub-page .badge{margin-top:16px}
.sub-page h1{margin-top:8px;font-size:32px;line-height:1.3;font-weight:900}
.sub-page .catch{margin-top:8px;font-size:16px;color:#3a352f}
.sub-page .acts{padding-top:20px}
.sub-page .modes{margin-top:18px}
.sub-page .mlabel{margin-top:18px;font-size:12px;font-weight:800;color:var(--sub)}
.sub-page .phone{margin-top:6px}
.sub-page .brand{margin-top:0}
.sub-page .stats{margin-top:16px}
.pcnote{margin-top:12px;font-size:13px;color:var(--sub)}
@media(prefers-reduced-motion:reduce){
.leaf,.media.pan img{animation:none!important}
.media.pan img{width:100%}
.media video{display:none}
html{scroll-behavior:auto}
.fcta,.fcta.on{transition:none}
}
</style>
</head>
<body>
<main class="col sub-page">
<a class="back" href="../">← ドパガキ問題集のトップへ</a>
<div class="sub-media"><div class="media"><picture><source srcset="../assets/miyashita.webp" type="image/webp"><img src="../assets/miyashita.jpg" alt="宮下パークFPS"></picture><video muted playsinline autoplay loop preload="metadata" data-src="../assets/miyashita.mp4" data-poster="../assets/miyashita.webp" aria-hidden="true" tabindex="-1"></video></div></div>
<span class="badge">PC向け</span>
<h1>宮下パークFPS</h1>
<p class="catch">国の3D都市モデル（PLATEAU）で、渋谷・宮下パークの屋上を再現</p>
<p class="credit">3D都市モデル：国土交通省 Project PLATEAU（CC BY 4.0）</p><p class="pcnote">パソコンのブラウザで開くのがおすすめです。</p>
<div class="acts">
<a class="btn" href="https://miyashita-park-fps.vercel.app">開く →</a>
<button type="button" class="btn sm ghost" data-share data-url="https://miyashita-park-fps.vercel.app" data-title="宮下パークFPS">PCで開く用にリンクを送る</button><p class="share-msg" role="status" aria-live="polite"></p>
</div>
<div class="acts" style="padding-top:28px"><a class="btn ghost sm" href="../">ほかの作品も見る</a></div>
</main>
<script>(function () {
  'use strict';
  var rm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hasIO = 'IntersectionObserver' in window;

  /* 動画: 近づいたら読み込み、見えている間だけ再生 */
  var vids = [].slice.call(document.querySelectorAll('video[data-src]'));
  if (vids.length && !rm && hasIO) {
    var vio = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        var v = e.target;
        if (e.isIntersecting) {
          if (!v._ready) {
            v._ready = true;
            if (v.dataset.poster) v.poster = v.dataset.poster;
            v.src = v.dataset.src;
            v.load();
          }
          var p = v.play();
          if (p && p.catch) p.catch(function () {});
        } else if (v._ready) {
          v.pause();
        }
      });
    }, { threshold: 0.25 });
    vids.forEach(function (v) { vio.observe(v); });
  }

  /* 1問チャレンジ */
  var quiz = document.getElementById('quiz');
  if (quiz) {
    var opts = [].slice.call(quiz.querySelectorAll('.opt'));
    var res = quiz.querySelector('.result');
    var verdict = res.querySelector('.verdict');
    var answered = false;
    opts.forEach(function (b) {
      b.addEventListener('click', function () {
        if (answered) return;
        answered = true;
        var ok = b.dataset.correct === '1';
        opts.forEach(function (o) {
          o.setAttribute('aria-disabled', 'true');
          if (o.dataset.correct === '1') o.classList.add('is-correct');
        });
        if (!ok) b.classList.add('is-wrong');
        res.classList.toggle('ok', ok);
        res.classList.toggle('ng', !ok);
        verdict.textContent = ok ? '正解です' : '不正解。正解はア（a）です';
        res.hidden = false;
      });
    });
    var retry = quiz.querySelector('.retry');
    if (retry) retry.addEventListener('click', function () {
      answered = false;
      opts.forEach(function (o) {
        o.removeAttribute('aria-disabled');
        o.classList.remove('is-correct', 'is-wrong');
      });
      res.hidden = true;
      quiz.scrollIntoView({ block: 'start' });
    });
  }

  /* 固定CTA: ドパガキ区間だけ。ファーストビューの主ボタンが見えている間は隠す */
  var zone = document.getElementById('dpg-zone');
  var cta = document.getElementById('fcta');
  var mainBtn = document.getElementById('main-cta');
  if (zone && cta && hasIO) {
    var inZone = false, mainVis = true;
    var upd = function () { cta.classList.toggle('on', inZone && !mainVis); };
    new IntersectionObserver(function (es) {
      inZone = es[es.length - 1].isIntersecting; upd();
    }, { rootMargin: '-45% 0px 0px 0px' }).observe(zone);
    if (mainBtn) {
      new IntersectionObserver(function (es) {
        mainVis = es[es.length - 1].isIntersecting; upd();
      }).observe(mainBtn);
    }
  }

  /* 共有: navigator.share → コピー → URL表示 */
  function legacyCopy(text) {
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('copy failed'));
    });
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function () { return legacyCopy(text); });
    }
    return legacyCopy(text);
  }
  function fallback(btn, msg, url) {
    copyText(url).then(function () {
      msg.className = 'share-msg ok';
      msg.textContent = 'コピーしました';
    }, function () {
      msg.className = 'share-msg';
      msg.textContent = url;
    });
  }
  document.addEventListener('click', function (ev) {
    var btn = ev.target.closest && ev.target.closest('[data-share]');
    if (!btn) return;
    var url = btn.dataset.url, title = btn.dataset.title;
    var msg = btn.parentNode.querySelector('.share-msg');
    if (navigator.share) {
      navigator.share({ title: title, url: url }).catch(function (err) {
        if (err && err.name === 'AbortError') return;
        fallback(btn, msg, url);
      });
    } else {
      fallback(btn, msg, url);
    }
  });
})();
</script>
</body>
</html>
